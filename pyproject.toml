[project]
name = "karaforge"
version = "0.1.0.dev0"
description = "KaraForge — open-source KTV karaoke video generator (align lyrics per character, edit, export)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "KaraForge contributors" }]
keywords = ["karaoke", "ktv", "lyrics", "forced-alignment", "ass", "subtitles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.26",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
kf = "karaforge.cli:main"

[project.urls]
Documentation = "https://github.com/karaforge/karaforge/tree/main/docs"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.380",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/karaforge", "bench/kfbench"]

[tool.hatch.build.targets.wheel.force-include]
"fonts" = "karaforge/_bundled/fonts"
"themes" = "karaforge/_bundled/themes"

[tool.hatch.build.targets.sdist]
include = ["engine", "bench", "fonts", "themes", "tests", "docs", "README.md", "README.en.md", "LICENSE"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["engine", "bench", "tests"]
extend-exclude = ["web", "typings", ".tools"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "PTH",          # pathlib
    "PERF",         # performance
    "N",            # naming
    "D",            # docstrings on public API
    "T20",          # no stray print()
    "RUF",
]
ignore = [
    "D105",    # magic-method docstrings
    "D107",    # __init__ docstrings (documented on the class)
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "RUF001",  # ambiguous unicode in strings: Chinese punctuation is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802", "N803", "N806"]
"scripts/**" = ["D", "T20"]
"typings/**" = ["D", "N", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["karaforge", "kfbench"]

# ------------------------------------------------------------------------ pyright
[tool.pyright]
include = ["engine", "bench", "tests"]
exclude = ["**/__pycache__", "**/node_modules", ".venv", ".tools", "web"]
extraPaths = ["engine", "bench"]
venvPath = "."
venv = ".venv"
stubPath = "typings"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"

# ------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine", "bench"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "ffmpeg: needs a working ffmpeg/ffprobe with libass",
    "models: needs downloaded model weights (skipped when they are missing)",
    "slow: takes more than a few seconds",
    "visual: renders frames and inspects pixels",
    "docker: needs a Docker daemon",
    "gpu: needs CUDA",
    "network: needs internet access",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["karaforge"]
branch = true
omit = ["*/_bundled/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
