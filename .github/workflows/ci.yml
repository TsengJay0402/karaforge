name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.9"
  KARAFORGE_HOME: ${{ github.workspace }}/.kfhome
  KARAFORGE_LANG: en

jobs:
  python-lint:
    name: Python lint + type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra cpu --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (with libass)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra cpu --frozen
      - name: Unit tests (no model weights needed)
        run: uv run --no-sync pytest -m "not models and not docker and not gpu" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  integration:
    name: Integration tests (cpu-lite, cached models)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (with libass)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra cpu --frozen
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ${{ env.KARAFORGE_HOME }}/models
          key: models-cpu-lite-${{ hashFiles('engine/karaforge/models/registry.json') }}
      - name: Download cpu-lite models
        run: uv run --no-sync kf models download --profile cpu-lite
      - name: Integration tests
        run: uv run --no-sync pytest -m "models and not gpu and not docker" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage.xml

  web:
    name: Web lint + type check + tests + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  e2e:
    name: Browser tests (Playwright, no models)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (with libass)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra cpu --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: End-to-end tests against the real server
        run: npm run e2e
        working-directory: web
        env:
          KARAFORGE_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  docker:
    name: Dockerfile lint + CPU image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: VARIANT=cpu
          tags: karaforge:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm karaforge:cpu doctor --no-models
