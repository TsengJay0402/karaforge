# KaraForge with Docker Compose.
#
#   CPU:     docker compose -f docker/docker-compose.yml up
#   NVIDIA:  docker compose -f docker/docker-compose.yml --profile gpu up karaforge-gpu
#
# Then open http://127.0.0.1:8765 .  Projects are kept in the `projects` folder at the top of
# the checkout (Compose resolves the path relative to this file; set KARAFORGE_PROJECTS_DIR to
# an absolute path to keep them elsewhere).  Model weights, user themes and user fonts live in
# the named volume `karaforge-home`: they are downloaded on first use and are never part of the
# image.
#
# On Linux the projects folder is written with user id 1000 unless you say otherwise.  If
# your own id is different (`id -u`), create the folder yourself and pass your ids:
#
#   mkdir -p projects
#   KARAFORGE_UID=$(id -u) KARAFORGE_GID=$(id -g) docker compose -f docker/docker-compose.yml up
#
# The port is published on 127.0.0.1 only: the server has no login.

name: karaforge

x-karaforge: &karaforge
  restart: unless-stopped
  user: "${KARAFORGE_UID:-1000}:${KARAFORGE_GID:-1000}"
  ports:
    - "127.0.0.1:${KARAFORGE_PORT:-8765}:8765"
  volumes:
    - ${KARAFORGE_PROJECTS_DIR:-../projects}:/data/projects
    - karaforge-home:/data/home
  environment:
    KARAFORGE_LANG: ${KARAFORGE_LANG:-zh}

services:
  karaforge:
    <<: *karaforge
    image: karaforge:cpu
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VARIANT: cpu

  karaforge-gpu:
    <<: *karaforge
    profiles: ["gpu"]
    image: karaforge:cuda
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VARIANT: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  karaforge-home:
